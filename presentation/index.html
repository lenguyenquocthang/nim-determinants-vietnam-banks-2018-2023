function readC(){const s=getComputedStyle(document.documentElement);const g=n=>s.getPropertyValue(n).trim();C={ink:g('--ink'),mut:g('--mut'),line:g('--line'),teal:g('--teal'),amber:g('--amber'),coral:g('--coral'),blue:g('--blue'),vio:g('--vio'),h0:g('--h0'),h1:g('--h1'),card:g('--card'),bg2:g('--bg2')}}
const hx=h=>{if(h.startsWith('rgb'))return h.match(/\d+/g).slice(0,3).map(Number);h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const mix=(a,b,t)=>{const x=hx(a),y=hx(b);return`rgb(${x.map((v,i)=>Math.round(lerp(v,y[i],t))).join(',')})`};
const heat=t=>mix(C.h0,C.h1,clamp(t));
const div=(v)=>v>=0?mix(C.card,C.teal,clamp(v)):mix(C.card,C.coral,clamp(-v));
// geometry
const geom=(W,H,m)=>({l:m.l,t:m.t,r:W-m.r,b:H-m.b,w:W-m.l-m.r,h:H-m.t-m.b});
const sx=(v,d0,d1,p0,p1)=>p0+(v-d0)/(d1-d0)*(p1-p0);
const tt=(x,y,s,cls='',a='start',extra='')=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${a}" class="${cls}" ${extra}>${s}</text>`;
const path=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
function partial(vals,t,X,Y){const n=vals.length-1,u=t*n,k=Math.floor(u),pts=[];for(let i=0;i<=Math.min(k,n);i++)pts.push([X(i),Y(vals[i])]);if(k<n&&u>k){const fr=u-k;pts.push([X(k+fr),Y(lerp(vals[k],vals[k+1],fr))])}return pts}
function gridY(g,ticks,Y,fmt){return ticks.map(v=>`<line class="gl" x1="${g.l}" x2="${g.r}" y1="${Y(v)}" y2="${Y(v)}"/>`+tt(g.l-6,Y(v)+4,fmt(v),'ax','end')).join('')}
function yrAxis(g,X){return YR.map((y,i)=>tt(X(i),g.b+18,y,'ax','middle')).join('')}
const small=W=>W<560;
// ------------------------------------------------------------------ scenes
const S=[];
const add=o=>S.push(o);
add({id:'hero',act:T('Mở đầu','Overview'),h:T('Điều gì quyết định biên lãi của ngân hàng?','What drives a bank’s interest margin?'),hero:1,vh:420,
 steps:[T('<p>27 ngân hàng thương mại cổ phần niêm yết, 6 năm từ 2018 đến 2023, tổng cộng 162 quan sát. Mỗi đường là biên lãi ròng (NIM) của một ngân hàng.</p>','<p>27 listed joint-stock commercial banks, six years from 2018 to 2023, 162 observations. Each line is one bank’s net interest margin (NIM).</p>'),
 T('<p>Đường cam là trung bình ngành: <em>3,07%</em> năm 2018, đỉnh <em>3,59%</em> năm 2022, <em>3,20%</em> năm 2023.</p>','<p>The amber line is the sector mean: <em>3.07%</em> in 2018, peaking at <em>3.59%</em> in 2022, then <em>3.20%</em> in 2023.</p>'),
 T('<p>PGBank (xanh lá) nằm dưới trung bình ở cả sáu năm. Bài đi tìm yếu tố giải thích khoảng cách đó.</p>','<p>PGBank (teal) sits below the mean in all six years. The study looks for what explains that gap.</p>')],
 cue:1,
 draw(c,p){const{W,H}=c,g=geom(W,H,{l:40,r:small(W)?34:52,t:20,b:34});const X=i=>g.l+i/5*g.w,Y=v=>g.b-v/10*g.h;let s=gridY(g,[0,2,4,6,8,10],Y,v=>v+'%')+yrAxis(g,X);
  const t=ease(seg(p,.02,.42)),dim=ease(seg(p,.62,.82));
  for(let b=0;b<NB;b++){if(b===PG)continue;s+=`<path d="${path(partial(nim[b],t,X,Y))}" fill="none" stroke="${C.blue}" stroke-width="1.4" opacity="${lerp(.5,.12,dim).toFixed(2)}"/>`}
  const tm=ease(seg(p,.4,.62));if(tm>0){s+=`<path d="${path(partial(ym,tm,X,Y))}" fill="none" stroke="${C.amber}" stroke-width="3.4" stroke-linecap="round"/>`;ym.forEach((v,i)=>{if(i/5<=tm+.001&&[0,4,5].includes(i))s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${C.amber}"/>`+tt(X(i),Y(v)-10,f(v)+'%','lb','middle',`style="fill:${C.amber}"`)})}
  const tp=ease(seg(p,.6,.85));s+=`<path d="${path(partial(nim[PG],Math.max(t,tp),X,Y))}" fill="none" stroke="${C.teal}" stroke-width="${lerp(1.6,3.6,tp).toFixed(1)}" stroke-linecap="round"/>`;
  if(t>.97){s+=tt(X(5)+6,Y(nim[0][5])+4,'VPB','lb','start',`style="fill:${C.blue}"`)}
  if(tp>.6)s+=tt(X(5)+6,Y(nim[PG][5])+4,'PGB','lb','start',`style="fill:${C.teal}"`);return s}});
add({id:'mean',act:T('Mở đầu','Overview'),h:T('Năm 2023 nhiều biến động, NIM vẫn là thước đo then chốt','2023 was turbulent, yet NIM remains the key gauge'),vh:340,
 steps:[T('<p class="q">Vì sao một con số quanh 3% lại đáng nghiên cứu?</p><p>NIM cho thấy ngân hàng tạo lợi nhuận từ tín dụng tốt đến đâu và quản lý chi phí huy động ra sao. Mỗi cột là NIM trung bình của 27 ngân hàng.</p>','<p class="q">Why does a number around 3% deserve a study?</p><p>NIM shows how well a bank earns from lending and manages funding cost. Each bar is the 27-bank mean.</p>'),
 T('<p>Vùng cam là các năm đại dịch (2019–2022). Biên lãi không sụp mà <em>đạt đỉnh</em> năm 2022.</p>','<p>The amber band marks the pandemic years (2019–2022). Margins did not collapse; they <em>peaked</em> in 2022.</p>'),
 T('<p>Lạm phát và tăng trưởng GDP trung bình cùng nhìn qua một thang: sau COVID-19, xung đột Nga–Ukraine đẩy lạm phát lên và các ngân hàng trung ương thắt chặt tiền tệ.</p>','<p>Mean inflation and GDP growth on the same scale: after COVID-19, the Russia–Ukraine conflict lifted inflation and central banks tightened.</p>')],
 draw(c,p){const{W,H}=c,g=geom(W,H,{l:40,r:20,t:24,b:34});const bw=g.w/6,Y=v=>g.b-v/10*g.h,X=i=>g.l+bw*(i+.5);let s=gridY(g,[0,2,4,6,8,10],Y,v=>v+'%');
  const band=seg(p,.34,.55);s+=`<rect x="${g.l+bw}" y="${g.t}" width="${bw*4}" height="${g.h}" fill="${C.amber}" opacity="${(.16*band).toFixed(3)}"/>`;if(band>.3)s+=tt(g.l+bw*3,g.t+14,'COVID-19','lb','middle',`style="fill:${C.amber};opacity:${band}"`);
  ym.forEach((v,i)=>{const t=ease(seg(p,.02+i*.045,.22+i*.045));const h=(g.b-Y(v))*t;s+=`<rect x="${X(i)-bw*.3}" y="${g.b-h}" width="${bw*.6}" height="${h}" rx="4" fill="${i===4?C.amber:C.blue}" opacity=".9"/>`+(t>.9?tt(X(i),g.b-h-6,f(v)+'%','lb','middle'):'')});
  s+=yrAxis(g,X);
  const m=ease(seg(p,.62,.9));[['INF',C.coral,'INF'],['GDP',C.teal,'GDP']].forEach(([k,col,lab])=>{const pts=partial(D.YM[k],m,X,Y);if(pts.length>1){s+=`<path d="${path(pts)}" fill="none" stroke="${col}" stroke-width="2.6" stroke-dasharray="6 4"/>`;const e=pts[pts.length-1];if(m>.97)s+=tt(e[0]+8,e[1]+4,lab,'lb','start',`style="fill:${col}"`)}});return s}});
add({id:'hist',act:T('Mở đầu','Overview'),h:T('Cùng một ngành, NIM cách nhau gần 16 lần','Same industry, NIM differs almost 16-fold'),vh:340,
 steps:[T('<p>Trong 162 quan sát, NIM trung bình là <em>3,26%</em> nhưng trải từ <em>0,59%</em> đến <em>9,43%</em>.</p>','<p>Across 162 observations NIM averages <em>3.26%</em> yet spans <em>0.59%</em> to <em>9.43%</em>.</p>'),
 T('<p>Phần lớn nằm trong khoảng 1% đến 4%; đuôi bên phải kéo dài đến những ngân hàng bán lẻ sinh lời cao.</p>','<p>Most sit between 1% and 4%; the right tail belongs to highly profitable retail-oriented banks.</p>'),
 T('<p>Khoảng cách lớn này là lý do bài đi tìm yếu tố giải thích: ngân hàng nào, năm nào, vì sao NIM cao hay thấp.</p>','<p>This spread is why the study looks for explanations: which bank, which year, and why NIM is high or low.</p>')],
 draw(c,p){const{W,H}=c,g=geom(W,H,{l:40,r:20,t:30,b:38}),all=D.P.map(r=>r[2]),bins=Array(20).fill(0);all.forEach(v=>bins[Math.min(19,Math.floor(v/.5))]++);const mx=Math.max(...bins),bw=g.w/20,Y=v=>g.b-v/(mx*1.1)*g.h;let s=gridY(g,[0,10,20,30].filter(v=>v<=mx*1.1),Y,v=>v);
  const tail=ease(seg(p,.4,.7));bins.forEach((n,i)=>{const t=ease(seg(p,.02+i*.012,.3+i*.012)),h=(g.b-Y(n))*t,hi=i>=10;s+=`<rect x="${g.l+i*bw+1.5}" y="${g.b-h}" width="${bw-3}" height="${h}" rx="3" fill="${hi?mix(C.blue,C.coral,tail):C.blue}" opacity=".92"/>`;});
  for(let v=0;v<=10;v+=2)s+=tt(g.l+v/10*g.w,g.b+18,v+'%','ax','middle');
  const mm=seg(p,.3,.45);if(mm>0){const x=g.l+3.259/10*g.w;s+=`<line x1="${x}" x2="${x}" y1="${g.t}" y2="${g.b}" stroke="${C.amber}" stroke-width="2.4" stroke-dasharray="5 4" opacity="${mm}"/>`+tt(x+6,g.t+12,(L==='vi'?'TB ':'mean ')+f(3.259)+'%','lb','start',`style="fill:${C.amber};opacity:${mm}"`)}
  const n10=bins.slice(10).reduce((a,b)=>a+b,0);if(tail>.1)s+=tt(g.r,g.t+32,(L==='vi'?'NIM > 5%: ':'NIM > 5%: ')+n10+(L==='vi'?' quan sát':' obs'),'lb','end',`style="fill:${C.coral};opacity:${tail}"`);
  s+=tt(g.l,g.b+32,(L==='vi'?'Số quan sát theo khoảng NIM 0,5 điểm %':'Observations per 0.5-pt NIM bin'),'ax');return s}});
add({id:'panel',act:T('Dữ liệu','Data'),h:T('Mỗi ô là một cặp ngân hàng và năm','Each cell is one bank-year'),vh:480,
 steps:[T('<p>Dữ liệu bảng: 27 ngân hàng × 6 năm = <em>162 quan sát</em>. Các ô lần lượt hiện ra.</p>','<p>Panel data: 27 banks × 6 years = <em>162 observations</em>. Cells appear one by one.</p>'),
 T('<p>Tô màu theo NIM (xếp theo NIM trung bình từ cao xuống thấp). Chênh lệch giữa các hàng lớn hơn nhiều so với chênh lệch giữa các cột.</p>','<p>Coloured by NIM (banks ordered by mean NIM). Differences between rows far exceed those between columns.</p>'),
 T('<p>Hàng PGBank: 3,04% năm 2018 xuống 2,66% năm 2023; hạng 11, 12, 13, rồi tụt xuống 24 năm 2021 và hồi lên 18 năm 2023.</p>','<p>PGBank’s row: 3.04% in 2018 to 2.66% in 2023; rank 11, 12, 13, then 24 in 2021 and back to 18 in 2023.</p>'),
 T('<p>Đọc theo cột: một năm giữa 27 ngân hàng. Đọc theo hàng: câu chuyện riêng của từng ngân hàng.</p>','<p>Read down a column: one year across 27 banks. Read along a row: one bank’s own story.</p>')],
 tech:T('NIM_it, i = 1…27, t = 2018…2023, N·T = 162','NIM_it, i = 1…27, t = 2018…2023, N·T = 162'),
 draw(c,p){const{W,H}=c,sm=small(W),g=geom(W,H,{l:sm?40:52,r:12,t:26,b:12});const cw=(g.w)/6,rh=g.h/NB;let s='';YR.forEach((y,j)=>{s+=tt(g.l+cw*(j+.5),g.t-8,y,'ax','middle')});
  const a=seg(p,0,.22),b=seg(p,.22,.4),pg=ease(seg(p,.5,.62)),col=ease(seg(p,.76,.88));const fs=Math.max(7.5,Math.min(11,rh*.62));
  const cnt=Math.round(a*162);for(let r=0;r<NB;r++){s+=tt(g.l-6,g.t+rh*(r+.68),BK[r],'ax','end',`style="font-size:${fs}px;${r===PG?'font-weight:800;fill:'+C.teal+' !important':''}"`);
   for(let j=0;j<6;j++){const k=r*6+j;if(k>=cnt)continue;const v=nim[r][j];const fill=b>0?mix(C.line,heat(v/9),ease(b)):C.line;const isP=r===PG,dimm=pg*(isP?0:.7)+col*(j===3?0:.55*(1-pg)) ;
    s+=`<rect x="${(g.l+cw*j+1.5).toFixed(1)}" y="${(g.t+rh*r+1).toFixed(1)}" width="${(cw-3).toFixed(1)}" height="${(rh-2).toFixed(1)}" rx="3" fill="${fill}" opacity="${(1-Math.min(.85,dimm)).toFixed(2)}" ${isP&&pg>.3?`stroke="${C.teal}" stroke-width="2"`:''}/>`;
    if(b>.8&&(rh>=14||isP)&&(!pg||isP||pg<.1)&&cw>38)s+=tt(g.l+cw*(j+.5),g.t+rh*(r+.68),f(v,1),'',"middle",`style="font-size:${fs-.5}px;fill:#0b1220;opacity:${(1-Math.min(.85,dimm)).toFixed(2)}"`)}}
  if(pg>.5){const rs=[0,1,2,3,4,5].map(j=>rank[j][PG]);YR.forEach((y,j)=>{s+=tt(g.l+cw*(j+.5),g.t+rh*(PG+.68)+(rh>14?0:0),'',"")});}
  if(pg>.6&&!col){const ry=g.t+rh*PG;rank.forEach((r,j)=>{s+=tt(g.l+cw*(j+1)-5,ry-3,'#'+r[PG],'lb','end',`style="font-size:10px;fill:${C.teal}"`)})}
  if(col>.1){const x=g.l+cw*3;s+=`<rect x="${x}" y="${g.t}" width="${cw}" height="${g.h}" fill="none" stroke="${C.amber}" stroke-width="2" opacity="${col}" rx="4"/>`+tt(x+cw/2,g.b+9,'2021','lb','middle',`style="fill:${C.amber}"`)}
  return s}});
add({id:'vars',act:T('Dữ liệu','Data'),h:T('Một biến phụ thuộc, sáu biến giải thích','One dependent variable, six explanatory'),vh:420,kind:'html',
 steps:[T('<p>Biến phụ thuộc là NIM. Ba biến nội tại, hai biến vĩ mô và một biến cú sốc.</p>','<p>The dependent variable is NIM, with three bank-level, two macro and one shock variable.</p>'),
 T('<p>Mỗi biến mang một <em>kỳ vọng dấu</em> rút từ các nghiên cứu trước: nợ xấu làm giảm NIM; quy mô và vốn chủ sở hữu làm tăng; lạm phát có thể hai chiều; GDP và đại dịch được kỳ vọng làm giảm.</p>','<p>Each variable carries an <em>expected sign</em> from earlier studies: bad loans cut NIM; size and equity raise it; inflation may go either way; GDP and the pandemic were expected to reduce it.</p>'),
 T('<p>Nguồn: báo cáo tài chính các ngân hàng, World Bank và bảng giá SSI. Phân tích bằng hồi quy dữ liệu bảng trên Stata 17.</p>','<p>Sources: bank financial statements, World Bank and SSI price boards. Panel regressions in Stata 17.</p>')],
 draw(c,p){const rows=[['NIM',T('Biên lãi ròng (%)','Net interest margin (%)'),'',T('Phụ thuộc','Dependent'),'var(--blue)'],['CAP',T('Quy mô vốn chủ sở hữu (%)','Equity capital size (%)'),'+',T('Báo cáo tài chính','Financial statements'),'var(--teal)'],['SIZE',T('Quy mô ngân hàng, log₂(tổng tài sản)','Bank size, log₂(total assets)'),'+',T('Báo cáo tài chính','Financial statements'),'var(--teal)'],['NPL',T('Tỷ lệ nợ xấu (%)','Non-performing loan ratio (%)'),'−',T('Báo cáo tài chính','Financial statements'),'var(--coral)'],['INF',T('Lạm phát (%)','Inflation (%)'),'±',T('World Bank','World Bank'),'var(--amber)'],['GDP',T('Tăng trưởng GDP (%)','GDP growth (%)'),'−',T('World Bank','World Bank'),'var(--coral)'],['COVID',T('Biến giả: 1 trong 2019–2022','Dummy: 1 in 2019–2022'),'−',T('Tự lập','Constructed'),'var(--coral)']];
  const a=seg(p,0,.35),b=seg(p,.38,.66),cc=seg(p,.7,.95);return rows.map((r,i)=>{const t=ease(seg(a,i/rows.length*.8,i/rows.length*.8+.35));return `<div class="row" style="grid-template-columns:62px 1fr 64px ${small(c.W)?'0':'130px'};opacity:${t};transform:translateX(${(1-t)*30}px)"><b style="color:${r[4]}">${r[0]}</b><span>${tx(r[1])}</span><span style="opacity:${ease(seg(b,i/rows.length*.6,i/rows.length*.6+.4))};text-align:center">${r[2]?`<span class="chip ${r[2]==='+'?'ok':r[2]==='±'?'wr':'no'}">${r[2]}</span>`:''}</span><span style="opacity:${ease(seg(cc,i/rows.length*.6,i/rows.length*.6+.4))};color:var(--mut);font-size:12px;${small(c.W)?'display:none':''}">${tx(r[3])}</span></div>`}).join('')}});
add({id:'pgb',act:T('PGBank','PGBank'),h:T('Ba mươi năm từ ngân hàng nông thôn đến ngân hàng số','Thirty years from a rural bank to a digital bank'),vh:460,
 steps:[T('<p>13/11/1993: Ngân hàng Nông thôn Đồng Tháp Mười bắt đầu hoạt động với vốn điều lệ 700 triệu đồng. 2005: Petrolimex và SSI góp vốn. 2007: chuyển thành ngân hàng đô thị, đổi tên PG Bank.</p>','<p>13 Nov 1993: Dong Thap Muoi Rural Bank opens with VND 700 million. 2005: Petrolimex and SSI invest. 2007: becomes an urban bank renamed PG Bank.</p>'),
 T('<p>Từ 2008 đến 2014, bảy năm liền nhận giải «Thương hiệu mạnh Việt Nam». Tháng 12/2023 đổi nhận diện và tên thành Ngân hàng TMCP Thịnh Vượng và Phát triển.</p>','<p>2008–2014: seven consecutive “Vietnam Strong Brand” awards. December 2023: rebrand to a new name and identity.</p>'),
 T('<p>Gần một trăm đầu mối: 18 chi nhánh, 64 phòng giao dịch, hơn 2.000 nhân viên, quan hệ đại lý với hơn 200 ngân hàng và chi nhánh trên thế giới.</p>','<p>Nearly a hundred outlets: 18 branches, 64 transaction offices, over 2,000 staff, correspondent ties with 200+ banks worldwide.</p>'),
 T('<p>Ba cổ đông cùng giữ khoảng 40% vốn: Gia Linh 13,099%, Quốc tế Cường Phát 13,541%, Thương mại Vũ Anh Đức 13,359%.</p>','<p>Three holders own about 40%: Gia Linh 13.099%, Quoc te Cuong Phat 13.541%, Thuong mai Vu Anh Duc 13.359%.</p>')],
 draw(c,p){const{W,H}=c,pd=24;let s='';const ty=H*.2,X=y=>sx(y,1993,2024,pd+10,W-pd-10);
  const t=ease(seg(p,0,.3));s+=`<line x1="${X(1993)}" x2="${lerp(X(1993),X(2024),t)}" y1="${ty}" y2="${ty}" stroke="${C.teal}" stroke-width="3" stroke-linecap="round"/>`;
  [[1993,'1993',0],[2005,'2005',-1],[2007,'2007',1],[2023.9,'12/2023',-1]].forEach(([y,l,u],i)=>{const a=ease(seg(p,.02+i*.06,.14+i*.06+(i>2?.12:0)));if(X(y)<=lerp(X(1993),X(2024),t)+1||i===3&&p>.3){const o=i===3?ease(seg(p,.3,.4)):a;s+=`<circle cx="${X(y)}" cy="${ty}" r="${6*o}" fill="${C.amber}"/>`+tt(X(y),ty+(u>0?26:-14),l,'lb','middle',`style="opacity:${o}"`)}});
  const aw=ease(seg(p,.22,.34));s+=`<rect x="${X(2008)}" y="${ty-9}" width="${(X(2014)-X(2008))*aw}" height="18" rx="9" fill="${C.amber}" opacity=".35"/>`+(aw>.8?tt((X(2008)+X(2014))/2,ty+4,'2008–14','lb','middle',`style="font-size:10px"`):'');
  const my=H*.5,k=ease(seg(p,.4,.66));[[18,T('chi nhánh','branches'),'+'],[64,T('phòng giao dịch','transaction offices'),'+'],[2000,T('nhân viên','staff'),'+'],[200,T('ngân hàng đại lý','correspondent banks'),'+']].forEach((e,i)=>{const w=(W-2*pd)/4,x=pd+w*(i+.5);const sw=ease(seg(k,i*.12,i*.12+.6));s+=tt(x,my,(e[0]>=200?'':'')+Math.round(e[0]*sw).toLocaleString(L==='vi'?'vi-VN':'en-US')+(e[0]>=200?'+':''),'',"middle",`style="font-size:${small(W)?24:34}px;font-weight:800;fill:${C.teal};opacity:${sw}"`)+tt(x,my+20,tx(e[1]),'ax','middle',`style="opacity:${sw}"`)});
  const by=H*.76,bh=34,bx=pd,bw=W-2*pd,sh=[[13.099,'Gia Linh',C.blue],[13.541,'Cường Phát',C.vio],[13.359,'Vũ Anh Đức',C.amber],[60.001,L==='vi'?'Cổ đông khác':'Others',C.line]];const gr=ease(seg(p,.72,.95));let cx=bx;s+=tt(bx,by-12,L==='vi'?'Cơ cấu sở hữu':'Ownership','lb');
  sh.forEach((e,i)=>{const w=bw*e[0]/100*gr;s+=`<rect x="${cx}" y="${by}" width="${w}" height="${bh}" fill="${e[2]}" opacity=".9"/>`;if(gr>.9&&i<3)s+=tt(cx+w/2,by+bh+16,f(e[0],1)+'%','ax','middle')+tt(cx+w/2,by+bh/2+4,e[1].slice(0,7),'',"middle",'style="font-size:9.5px;fill:#0b1220"');cx+=w});
  if(gr>.9)s+=tt(bx+bw*.8,by+bh/2+4,L==='vi'?'Cổ đông khác ≈60%':'Others ≈60%','',"middle",`style="font-size:11px"`);return s}});
add({id:'pgbline',act:T('PGBank','PGBank'),h:T('NIM của PGBank thấp hơn trung bình, hạng đổi theo năm','PGBank’s NIM stays below the mean; rank moves'),vh:320,
 steps:[T('<p>NIM của PGBank giảm từ 3,04% năm 2018 xuống 2,66% năm 2023, thấp hơn trung bình ngành ở cả sáu năm.</p>','<p>PGBank’s NIM falls from 3.04% in 2018 to 2.66% in 2023, below the sector mean in all six years.</p>'),
 T('<p>Hạng trong 27 ngân hàng: 11, 12, 13, rồi tụt xuống 24 năm 2021 và hồi lên 18 năm 2023.</p>','<p>Rank among 27 banks: 11, 12, 13, then 24 in 2021 and back to 18 in 2023.</p>'),
 T('<p>Đây là lý do chọn đề tài: hiểu yếu tố nào kéo NIM lên hoặc xuống.</p>','<p>That is why the topic matters: which factors push NIM up or down.</p>')],
 draw(c,p){const{W,H}=c,g=geom(W,H,{l:40,r:24,t:74,b:34});const X=i=>g.l+i/5*g.w,Y=v=>g.b-(v-2)/(4-2)*g.h;let s=gridY(g,[2,2.5,3,3.5,4],Y,v=>f(v,1)+'%')+yrAxis(g,X);
  const a=ease(seg(p,.02,.4)),gap=ease(seg(p,.3,.5));const pg=nim[PG];
  const mp=partial(ym,a,X,Y),pp=partial(pg,a,X,Y);s+=`<path d="${path(mp)}" fill="none" stroke="${C.amber}" stroke-width="3" stroke-dasharray="7 5"/>`;
  if(gap>0&&mp.length===pp.length&&mp.length>1)s+=`<path d="${path(mp)} ${pp.slice().reverse().map(q=>'L'+q[0]+' '+q[1]).join('')}Z" fill="${C.coral}" opacity="${(.18*gap).toFixed(2)}"/>`;
  s+=`<path d="${path(pp)}" fill="none" stroke="${C.teal}" stroke-width="3.6" stroke-linecap="round"/>`;
  pg.forEach((v,i)=>{if(i/5<=a+.001)s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${C.teal}"/>`+(i===0||i===5?tt(X(i),Y(v)+(i?20:20),f(v)+'%','lb','middle',`style="fill:${C.teal}"`):'')});
  const rk=ease(seg(p,.4,.7));pg.forEach((v,i)=>{const o=ease(seg(rk,i*.1,i*.1+.4));if(o>0){s+=`<g opacity="${o}"><rect x="${X(i)-20}" y="${g.t-34-(1-o)*10}" width="40" height="22" rx="11" fill="${rank[i][PG]>=20?C.coral:C.teal}"/>${tt(X(i),g.t-19-(1-o)*10,'#'+rank[i][PG],'lb','middle','style="fill:#0b1220"')}</g>`}});
  s+=tt(g.l,g.t-46,L==='vi'?'Hạng trong 27 ngân hàng':'Rank among 27 banks','ax');s+=tt(g.r,g.t+12,L==='vi'?'Trung bình ngành':'Sector mean','lb','end',`style="fill:${C.amber}"`);return s}});
add({id:'model',act:T('Mô hình','Model'),h:T('Một đường chung hay 27 đường song song?','One common line or 27 parallel lines?'),vh:420,
 steps:[T('<p>Mỗi chấm là một quan sát (CAP, NIM). Pooled OLS xem mọi quan sát cùng một quần thể: <em>một đường</em> với một hệ số chặn chung.</p>','<p>Each dot is a (CAP, NIM) observation. Pooled OLS treats all as one population: <em>a single line</em> with one intercept.</p>'),
 T('<p>FEM cho mỗi ngân hàng một hệ số chặn riêng và chỉ dùng biến động trong nội bộ ngân hàng: <em>27 đường song song</em> (minh hoạ: cùng độ dốc FEM của CAP, đi qua trung bình của từng ngân hàng).</p>','<p>FEM gives each bank its own intercept and uses only within-bank variation: <em>27 parallel lines</em> (illustration: FEM slope for CAP through each bank’s mean).</p>'),
 T('<p>REM coi khác biệt giữa ngân hàng là thành phần sai số ngẫu nhiên. Kiểm định Hausman (p = 0,0036) chọn FEM.</p>','<p>REM treats between-bank differences as a random error component. The Hausman test (p = 0.0036) picks FEM.</p>')],
 tech:T('Pooled: NIM_it = α + β′X_it + ε_it  |  FEM: NIM_it = α_i + β′X_it + ε_it  |  REM: α_i = α + u_i','Pooled: NIM_it = α + β′X_it + ε_it  |  FEM: NIM_it = α_i + β′X_it + ε_it  |  REM: α_i = α + u_i'),
 draw(c,p){const{W,H}=c,g=geom(W,H,{l:40,r:20,t:20,b:40});const X=v=>sx(v,4,18,g.l,g.r),Y=v=>sx(v,0,10,g.b,g.t);let s=gridY(g,[0,2,4,6,8,10],Y,v=>v+'%');for(let v=4;v<=18;v+=2)s+=tt(X(v),g.b+18,v+'%','ax','middle');s+=tt(g.r,g.b+34,L==='vi'?'CAP (vốn chủ sở hữu, %)':'CAP (equity, %)','ax','end');
  const a=ease(seg(p,0,.2)),col=ease(seg(p,.4,.62)),lines=ease(seg(p,.5,.78)),pool=1-seg(p,.5,.66);const xs=D.P.map(r=>r[3]),ys=D.P.map(r=>r[2]),o=olsl(xs,ys);
  D.P.forEach((r,i)=>{const hue=Math.round(r[0]*360/NB);const fill=col>0?`hsl(${hue},75%,${C.ink.length&&document.documentElement.dataset.theme==='light'?45:62}%)`:C.blue;s+=`<circle cx="${X(r[3])}" cy="${Y(r[2])}" r="${3.6*ease(seg(a,i/162*.8,i/162*.8+.2))}" fill="${col>0?fill:C.blue}" opacity="${lerp(.7,.9,col)}"/>`});
  const pl=ease(seg(p,.14,.34));if(pool>0)s+=`<line x1="${X(4)}" y1="${Y(o.a+o.b*4)}" x2="${lerp(X(4),X(18),pl)}" y2="${Y(lerp(o.a+o.b*4,o.a+o.b*18,pl))}" stroke="${C.amber}" stroke-width="3.6" opacity="${pool}" stroke-linecap="round"/>`;
  const bf=D.M.fe.CAP[0];for(let b=0;b<NB;b++){const mx=mean(D.P.filter(r=>r[0]===b).map(r=>r[3])),my=mean(nim[b]);const x0=Math.max(4,mx-4),x1=Math.min(18,mx+4);const e=lines;s+=`<line x1="${X(mx-(mx-x0)*e)}" y1="${Y(my-bf*(mx-x0)*e)}" x2="${X(mx+(x1-mx)*e)}" y2="${Y(my+bf*(x1-mx)*e)}" stroke="hsl(${Math.round(b*360/NB)},75%,${document.documentElement.dataset.theme==='light'?40:70}%)" stroke-width="2" opacity="${(.9*e).toFixed(2)}" stroke-linecap="round"/>`}
  if(pool>0.2)s+=tt(g.l+8,g.t+12,L==='vi'?'Pooled OLS: một đường chung (hồi quy đơn biến)':'Pooled OLS: one line (simple regression)','lb','start',`style="fill:${C.amber};opacity:${pool}"`);if(lines>.4)s+=tt(g.l+8,g.t+12,L==='vi'?'FEM: mỗi ngân hàng một mặt bằng riêng':'FEM: each bank has its own level','lb','start',`style="fill:${C.teal};opacity:${lines}"`);return s}});
add({id:'tests',act:T('Mô hình','Model'),h:T('FEM thắng, nhưng phải sửa bằng FGLS','FEM wins, but FGLS is needed'),vh:440,kind:'html',
 steps:[T('<p>Kiểm định F và Breusch–Pagan bác bỏ Pooled OLS; Hausman chọn FEM thay REM.</p>','<p>The F and Breusch–Pagan tests reject Pooled OLS; Hausman prefers FEM over REM.</p>'),
 T('<p>Nhưng phần dư của FEM vi phạm ba giả định: phương sai sai số thay đổi, tự tương quan và phụ thuộc chéo. VIF trung bình 1,32 nên không đa cộng tuyến.</p>','<p>But FEM residuals violate three assumptions: heteroskedasticity, autocorrelation and cross-sectional dependence. Mean VIF 1.32 means no multicollinearity.</p>'),
 T('<p>Vì ba vi phạm đó, bài chuyển sang <em>FGLS</em> để có ước lượng đáng tin hơn.</p>','<p>Because of those three violations the study moves to <em>FGLS</em> for more reliable estimates.</p>')],
 tech:T('FGLS: β̂ = (X′Ω̂⁻¹X)⁻¹X′Ω̂⁻¹y, Ω̂ ước lượng từ phần dư (phương sai khác nhau, AR(1) chung)','FGLS: β̂ = (X′Ω̂⁻¹X)⁻¹X′Ω̂⁻¹y, Ω̂ estimated from residuals (panel-specific variance, AR(1))'),
 draw(c,p){const R=[[T('Kiểm định F','F test'),T('Bác bỏ Pooled OLS','Rejects Pooled OLS'),'ok',T('chọn FEM','→ FEM')],[T('Breusch–Pagan LM','Breusch–Pagan LM'),T('Bác bỏ Pooled OLS','Rejects Pooled OLS'),'ok',T('có hiệu ứng riêng','individual effects')],[T('Hausman','Hausman'),'p = 0,0036','ok',T('FEM thay REM','FEM over REM')],[T('VIF trung bình','Mean VIF'),'1,32','ok',T('không đa cộng tuyến','no multicollinearity')],[T('Phương sai sai số','Error variance'),T('thay đổi','heteroskedastic'),'no',T('vi phạm','violated')],[T('Tự tương quan','Autocorrelation'),'p = 0,0009','no',T('vi phạm','violated')],[T('Phụ thuộc chéo','Cross-sectional dep.'),'p = 0,0092','no',T('vi phạm','violated')]];
  const a=seg(p,0,.7);const out=R.map((r,i)=>{const t=ease(seg(a,i/R.length*.85,i/R.length*.85+.3));return`<div class="row" style="grid-template-columns:1fr 1fr auto;opacity:${t};transform:translateY(${(1-t)*18}px)"><b>${tx(r[0])}</b><span class="mono" style="color:var(--mut)">${tx(r[1])}</span><span class="chip ${r[2]}">${tx(r[3])}</span></div>`}).join('');const z=ease(seg(p,.78,.95));return out+`<div class="row" style="margin-top:8px;border-color:var(--teal);justify-content:center;grid-template-columns:1fr;text-align:center;font-weight:750;font-size:16px;opacity:${z};transform:scale(${lerp(.92,1,z)})">→ FGLS</div>`}});
add({id:'desc',act:T('Khám phá','Explore'),h:T('Từng biến: biên độ, trung bình, và khi có COVID','Each variable: range, mean, and under COVID'),vh:340,kind:'html',
 steps:[T('<p>Mỗi thanh là khoảng từ nhỏ nhất đến lớn nhất của biến (thang riêng); vạch là giá trị trung bình. NIM 3,26% (độ lệch 1,38); NPL trung bình 2,08% nhưng cao nhất tới 29,76%.</p>','<p>Each bar spans min to max (own scale); the tick marks the mean. NIM averages 3.26% (SD 1.38); NPL averages 2.08% but peaks at 29.76%.</p>'),
 T('<p>So sánh trung bình các năm thường (2018, 2023) với bốn năm COVID: NIM 3,14% → 3,32%, còn nợ xấu bình quân lại <em>thấp hơn</em> (2,42% → 1,91%).</p>','<p>Mean in normal years (2018, 2023) versus the four COVID years: NIM 3.14% → 3.32% while average NPL is <em>lower</em> (2.42% → 1.91%).</p>')],
 draw(c,p){const ks=['NIM','CAP','SIZE','NPL','INF','GDP'];const a=seg(p,0,.45),b=ease(seg(p,.55,.9));return ks.map((k,i)=>{const [m,sd,mn,mxv]=D.DS.all[k];const t=ease(seg(a,i*.1,i*.1+.4));const no=D.DS.no[k][0],cv=D.DS.cv[k][0];const w=small(c.W);
   return`<div class="row" style="grid-template-columns:50px 1fr ${w?'':'96px'} ${w?'':'96px'};opacity:${t};transform:translateY(${(1-t)*14}px)"><b>${k}</b><div style="position:relative;height:14px;background:var(--line);border-radius:7px"><div style="position:absolute;left:0;top:0;bottom:0;width:${t*100}%;border-radius:7px;background:linear-gradient(90deg,var(--blue),var(--teal));opacity:.55"></div><div style="position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--amber);left:${((m-mn)/(mxv-mn)*100*t).toFixed(1)}%"></div></div>${w?'':`<span class="mono" style="font-size:12px;color:var(--mut)">${f(mn,1)}–${f(mxv,1)}</span><span class="mono" style="font-size:12px;opacity:${b}">${f(no)} → <b style="color:${cv>no?'var(--amber)':'var(--teal)'}">${f(cv)}</b></span>`}</div>`}).join('')+(small(c.W)?'':`<div style="text-align:right;color:var(--mut);font-size:12px">${L==='vi'?'cột phải: năm thường → năm COVID (trung bình)':'right: normal years → COVID years (mean)'}</div>`)}});
add({id:'multi',act:T('Khám phá','Explore'),h:T('Sáu biến qua sáu năm','Six variables over six years'),vh:300,
 steps:[T('<p>Mỗi ô là trung bình của 27 ngân hàng theo năm. Vùng cam là các năm COVID.</p>','<p>Each panel shows the 27-bank mean by year. The amber band marks COVID years.</p>'),
 T('<p>CAP và SIZE đi lên đều; NIM đạt đỉnh 2022; lạm phát và GDP chỉ đổi theo năm nên cả 27 ngân hàng cùng chung một giá trị.</p>','<p>CAP and SIZE rise steadily; NIM peaks in 2022; inflation and GDP vary only by year, so all 27 banks share a value.</p>')],
 draw(c,p){const{W,H}=c,cols=W>600?3:2,rows=6/cols,ks=['NIM','CAP','SIZE','NPL','INF','GDP'],cw=W/cols,rh=H/rows;let s='';ks.forEach((k,i)=>{const ox=(i%cols)*cw,oy=Math.floor(i/cols)*rh,g={l:ox+14,r:ox+cw-14,t:oy+34,b:oy+rh-22};const v=D.YM[k],mn=Math.min(...v),mxv=Math.max(...v),pad=(mxv-mn)*.3||.1;const X=j=>sx(j,0,5,g.l,g.r),Y=u=>sx(u,mn-pad,mxv+pad,g.b,g.t);const t=ease(seg(p,i*.06,.5+i*.06));
  s+=`<rect x="${X(1)}" y="${g.t}" width="${X(4)-X(1)}" height="${g.b-g.t}" fill="${C.amber}" opacity=".12"/>`+tt(g.l,oy+22,k,'lb','start',`style="fill:${[C.blue,C.teal,C.vio,C.coral,C.amber,C.teal][i]}"`)+tt(g.r,oy+22,f(v[0],1)+' → '+f(v[5],1),'ax','end');const col=[C.blue,C.teal,C.vio,C.coral,C.amber,C.teal][i];s+=`<path d="${path(partial(v,t,X,Y))}" fill="none" stroke="${col}" stroke-width="2.8" stroke-linecap="round"/>`;v.forEach((u,j)=>{if(j/5<=t+.001)s+=`<circle cx="${X(j)}" cy="${Y(u)}" r="2.8" fill="${col}"/>`});s+=tt(g.l,g.b+14,'2018','ax','start')+tt(g.r,g.b+14,'2023','ax','end')});return s}});
add({id:'dumb',act:T('Khám phá','Explore'),h:T('20 trên 27 ngân hàng có NIM năm dịch cao hơn','20 of 27 banks had higher NIM in COVID years'),vh:400,
 steps:[T('<p class="q">Đại dịch có thật sự kéo biên lãi xuống?</p><p>Mỗi hàng là một ngân hàng. Chấm xám là NIM trung bình các năm thường (2018, 2023).</p>','<p class="q">Did the pandemic really squeeze margins?</p><p>Each row is a bank. The grey dot is mean NIM in normal years (2018, 2023).</p>'),
 T('<p>Chấm màu là trung bình bốn năm COVID; <em>cam</em> nghĩa là NIM năm dịch cao hơn. Xếp theo mức chênh.</p>','<p>The coloured dot is the four-year COVID mean; <em>amber</em> means higher NIM during COVID. Sorted by gap.</p>'),
 T('<p>Trung bình ngành tăng từ 3,14% lên 3,32%: dấu hiệu đầu tiên cho thấy giả thuyết «COVID làm NIM giảm» khó đứng vững.</p>','<p>Sector mean rises from 3.14% to 3.32%: a first sign that “COVID lowers NIM” is hard to sustain.</p>')],
 draw(c,p){const{W,H}=c,g=geom(W,H,{l:44,r:24,t:20,b:34});const order=[...Array(NB).keys()].sort((a,b)=>(covMean[b][1]-covMean[b][0])-(covMean[a][1]-covMean[a][0]));const rh=g.h/NB,X=v=>sx(v,0,10,g.l,g.r);let s='';for(let v=0;v<=10;v+=2)s+=`<line class="gl" x1="${X(v)}" x2="${X(v)}" y1="${g.t}" y2="${g.b}"/>`+tt(X(v),g.b+16,v+'%','ax','middle');
  const a=ease(seg(p,0,.3)),m=ease(seg(p,.35,.7)),srt=ease(seg(p,.55,.8)),fs=Math.max(7.5,Math.min(11,rh*.62));let up=0;
  order.forEach((b,r)=>{const idx0=b,y0=g.t+rh*(idx0+.5),y1=g.t+rh*(r+.5),y=lerp(y0,y1,srt);const [n0,c0]=covMean[b];const up1=c0>n0;if(up1)up++;const cx=lerp(n0,c0,m),col=up1?C.amber:C.teal;const isP=b===PG;
   s+=tt(g.l-6,y+3,BK[b],'ax','end',`style="font-size:${fs}px;${isP?'fill:'+C.teal+' !important;font-weight:800':''}"`)+`<line x1="${X(n0)}" x2="${X(cx)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="2.4" opacity=".8"/><circle cx="${X(n0)}" cy="${y}" r="${3.6*a}" fill="${C.mut}"/><circle cx="${X(cx)}" cy="${y}" r="${4.4*a}" fill="${col}" ${isP?`stroke="${C.ink}" stroke-width="1.5"`:''}/>`});
  if(m>.9)s+=tt(g.r,g.b-10,`${up}/27 ${L==='vi'?'ngân hàng cao hơn':'banks higher'}`,'lb','end',`style="fill:${C.amber}"`);return s}});
add({id:'corr',act:T('Khám phá','Explore'),h:T('CAP và SIZE đi cùng NIM, các biến còn lại yếu','CAP and SIZE move with NIM; the rest are weak'),vh:300,
 steps:[T('<p>Ma trận tương quan của 7 biến, mỗi ô lần lượt hiện ra. Màu xanh là dương, đỏ là âm.</p>','<p>Correlation matrix of 7 variables, cells appearing in turn. Teal is positive, red negative.</p>'),
 T('<p>Hàng NIM: CAP <em>+0,55</em>, SIZE <em>+0,37</em>, NPL −0,10; INF, GDP, COVID gần bằng 0. Lạm phát và GDP đi cùng nhau (+0,51) vì cùng đổi theo năm.</p>','<p>NIM row: CAP <em>+0.55</em>, SIZE <em>+0.37</em>, NPL −0.10; INF, GDP, COVID near zero. Inflation and GDP co-move (+0.51) as both vary by year.</p>')],
 draw(c,p){const{W,H}=c,n=7,lab=['NIM','CAP','SIZE','NPL','INF','GDP','COV'],M=D.CR.all;const sz=Math.min((W-70)/n,(H-60)/n),ox=(W-sz*n)/2+20,oy=(H-sz*n)/2+10;const a=seg(p,0,.55),h=ease(seg(p,.6,.85));let s='';lab.forEach((l,i)=>{s+=tt(ox+sz*(i+.5),oy-8,l,'ax','middle')+tt(ox-6,oy+sz*(i+.6),l,'ax','end')});
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const k=(i+j)/(2*(n-1));const t=ease(seg(a,k*.7,k*.7+.3));const v=M[i][j];const dim=1-h*.75*(i===0||j===0?0:1);s+=`<rect x="${ox+sz*j+2}" y="${oy+sz*i+2}" width="${sz-4}" height="${sz-4}" rx="6" fill="${div(v)}" opacity="${t*dim}" transform="translate(${sz/2*(1-t)} ${sz/2*(1-t)}) scale(${lerp(.6,1,t)})" style="transform-box:fill-box"/>`+(t>.7?tt(ox+sz*(j+.5),oy+sz*(i+.5)+4,f(v),'',"middle",`style="font-size:${Math.min(12,sz/3.6)}px;opacity:${dim};fill:${Math.abs(v)>.6?'#06231f':C.ink}"`):'')}return s}});
add({id:'scatter',act:T('Khám phá','Explore'),h:T('Từng biến so với NIM','Each variable against NIM'),vh:480,
 steps:[T('<p>CAP: dốc lên rõ nhất. Mỗi chấm là một quan sát; chấm cam là năm COVID; đường là hồi quy đơn biến.</p>','<p>CAP: the clearest upward slope. Each dot is an observation; amber dots are COVID years; the line is a simple regression.</p>'),
 T('<p>SIZE: quan hệ dương, nhưng các ngân hàng xếp thành cụm theo quy mô.</p>','<p>SIZE: positive, but banks cluster by scale.</p>'),
 T('<p>NPL: chiều âm nhẹ, tập trung ở vùng nợ xấu thấp; vài ngoại lệ rất cao.</p>','<p>NPL: mildly negative, concentrated at low NPL with a few extreme outliers.</p>'),
 T('<p>GDP: gần như phẳng. Chỉ có sáu giá trị khác nhau, nên các chấm xếp thành sáu cột.</p>','<p>GDP: almost flat. Only six distinct values, so dots line up in six columns.</p>')],
 draw(c,p){const{W,H}=c,g=geom(W,H,{l:40,r:20,t:30,b:44}),ks=['CAP','SIZE','NPL','GDP'],u=p*4,k=Math.min(3,Math.floor(u)),fr=ease(clamp((u-k-.2)/.55)),k2=Math.min(3,k+1);const kk=k===3?3:k;const sc=kk2=>{const col=V[ks[kk2]];const v=D.P.map(r=>r[col]);return[Math.min(...v),Math.max(...v)]};
  const A=sc(k),B=sc(k2);const px=(v,kk2,r)=>{const[a,b]=sc(kk2);return sx(r,a,b,g.l,g.r)};const Y=v=>sx(v,0,10,g.b,g.t);let s=gridY(g,[0,2,4,6,8,10],Y,v=>v+'%');
  const ep=k===3?0:fr;const pos=r=>lerp(sx(r[V[ks[k]]],A[0],A[1],g.l,g.r),sx(r[V[ks[k2]]],B[0],B[1],g.l,g.r),ep);
  D.P.forEach(r=>{s+=`<circle cx="${pos(r).toFixed(1)}" cy="${Y(r[2]).toFixed(1)}" r="3.5" fill="${r[8]?C.amber:C.blue}" opacity=".75"/>`});
  const fit=kk2=>{const o=olsl(D.P.map(r=>r[V[ks[kk2]]]),D.P.map(r=>r[2]));const[a,b]=sc(kk2);return{x0:g.l,x1:g.r,y0:Y(o.a+o.b*a),y1:Y(o.a+o.b*b),r:o.r}};const F0=fit(k),F1=fit(k2);const e=ep;
  s+=`<line x1="${g.l}" x2="${g.r}" y1="${lerp(F0.y0,F1.y0,e)}" y2="${lerp(F0.y1,F1.y1,e)}" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"/>`;
  const cur=e>.5?k2:k;s+=tt(g.r,g.b+34,`${ks[cur]}  (r = ${f(fit(cur).r)})`,'lb','end',`style="fill:${C.teal}"`);s+=tt(g.l,g.b+16,f(sc(cur)[0],1),'ax','start')+tt(g.r,g.b+16,f(sc(cur)[1],1),'ax','end');return s}});
add({id:'forest',act:T('Kết quả','Results'),h:T('Bốn mô hình, một bức tranh khá nhất quán','Four models, one fairly consistent picture'),vh:440,
 steps:[T('<p>Pooled OLS: CAP và SIZE dương rõ; NPL, lạm phát, GDP, COVID không có ý nghĩa. Khoảng là ±1,96 sai số chuẩn.</p>','<p>Pooled OLS: CAP and SIZE clearly positive; NPL, inflation, GDP, COVID insignificant. Bars are ±1.96 standard errors.</p>'),
 T('<p>FEM: tác động của CAP co lại, NPL và GDP trở nên có ý nghĩa khi kiểm soát đặc điểm riêng của từng ngân hàng.</p>','<p>FEM: the CAP effect shrinks; NPL and GDP become significant once bank-specific traits are controlled.</p>'),
 T('<p>REM: gần với FEM; Hausman cho thấy nên chọn FEM.</p>','<p>REM: close to FEM; Hausman says to prefer FEM.</p>'),
 T('<p>FGLS (mô hình báo cáo): CAP +0,185, SIZE +0,294, NPL −0,052, GDP +0,031, COVID +0,128 (p = 0,044), lạm phát −0,053 không có ý nghĩa (p = 0,249).</p>','<p>FGLS (reported model): CAP +0.185, SIZE +0.294, NPL −0.052, GDP +0.031, COVID +0.128 (p = 0.044), inflation −0.053 insignificant (p = 0.249).</p>')],
 draw(c,p){const{W,H}=c,g=geom(W,H,{l:62,r:24,t:34,b:34}),X=v=>sx(v,-.5,.6,g.l,g.r);const mods=[['Pooled OLS',D.M.po],['FEM',D.M.fe],['REM',D.M.re],['FGLS',FG]];const get=(mi,k)=>{if(mi===3){const q=FG[k];return[q[0],q[1]]}const o=mods[mi][1][k==='COV'?'cov':k];return[o[0],o[2]]};
  const u=p*4,k=Math.min(3,Math.floor(u)),e=k===3?0:ease(clamp((u-k-.2)/.55)),k2=Math.min(3,k+1);let s='';for(let v=-.4;v<=.6;v+=.2)s+=`<line class="gl" x1="${X(v)}" x2="${X(v)}" y1="${g.t}" y2="${g.b}"/>`+tt(X(v),g.b+16,f(v,1),'ax','middle');s+=`<line x1="${X(0)}" x2="${X(0)}" y1="${g.t}" y2="${g.b}" stroke="${C.mut}" stroke-width="1.6"/>`;
  const rh=g.h/6;VK.forEach((kn,i)=>{const a=get(k,kn),b=get(k2,kn),cf=lerp(a[0],b[0],e),se=lerp(a[1],b[1],e),y=g.t+rh*(i+.5),sig=Math.abs(cf/se)>1.96,col=sig?(cf>0?C.teal:C.coral):C.mut;s+=tt(g.l-8,y+4,kn,'lb','end')+`<line x1="${X(cf-1.96*se)}" x2="${X(cf+1.96*se)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="3" stroke-linecap="round" opacity=".85"/><circle cx="${X(cf)}" cy="${y}" r="6.5" fill="${col}" stroke="${C.ink}" stroke-width="1.2"/>`+tt(X(Math.max(cf+1.96*se,cf))+8,y+4,sg(cf),'ax','start')});
  const cur=e>.5?k2:k;s+=tt(g.r,g.t-12,mods[cur][0],'lb','end',`style="fill:${C.teal};font-size:15px"`);return s}});
add({id:'beta',act:T('Kết quả','Results'),h:T('CAP và SIZE chi phối, NPL kéo xuống','CAP and SIZE dominate, NPL pulls down'),vh:260,
 steps:[T('<p>Chuẩn hoá hệ số theo độ lệch chuẩn để so sánh công bằng: CAP +0,41, SIZE +0,33, NPL −0,10, GDP +0,05, COVID +0,04, lạm phát −0,02.</p>','<p>Coefficients standardised by SD for a fair comparison: CAP +0.41, SIZE +0.33, NPL −0.10, GDP +0.05, COVID +0.04, inflation −0.02.</p>'),
 T('<p>Nếu mỗi yếu tố biến động «một phần» thông thường của nó, CAP và SIZE làm NIM đổi nhiều nhất; yếu tố vĩ mô chỉ tác động nhẹ.</p>','<p>If each factor moves by one typical unit, CAP and SIZE shift NIM most; macro factors matter little.</p>')],
 draw(c,p){const{W,H}=c,g=geom(W,H,{l:70,r:44,t:20,b:20}),ks=Object.keys(SB).sort((a,b)=>Math.abs(SB[b])-Math.abs(SB[a])),rh=g.h/6,X=v=>sx(v,-.2,.5,g.l,g.r);let s=`<line x1="${X(0)}" x2="${X(0)}" y1="${g.t}" y2="${g.b}" stroke="${C.mut}" stroke-width="1.6"/>`;ks.forEach((k,i)=>{const t=ease(seg(p,i*.08,.5+i*.08)),v=SB[k]*t,y=g.t+rh*(i+.5);s+=tt(g.l-10,y+4,k,'lb','end')+`<rect x="${Math.min(X(0),X(v))}" y="${y-rh*.3}" width="${Math.abs(X(v)-X(0))}" height="${rh*.6}" rx="5" fill="${SB[k]>=0?C.teal:C.coral}" opacity="${Math.abs(SB[k])<.06?.45:.95}"/>`+tt(X(v)+(v>=0?8:-8),y+4,sg(SB[k],2),'ax',v>=0?'start':'end')});return s}});
add({id:'verdict',act:T('Kết quả','Results'),h:T('Bốn giả thuyết được ủng hộ, hai không','Four hypotheses supported, two not'),vh:420,kind:'html',
 steps:[T('<p>H1 (NPL −), H2 (SIZE +) và H3 (CAP +) được ủng hộ. H4 (lạm phát) không có ý nghĩa, phù hợp kỳ vọng hai chiều.</p>','<p>H1 (NPL −), H2 (SIZE +) and H3 (CAP +) are supported. H4 (inflation) is insignificant, in line with a two-way expectation.</p>'),
 T('<p>H5 không được ủng hộ: GDP tác động dương, trái kỳ vọng. H6 cũng không: các năm COVID đi cùng NIM cao hơn. Một cách giải thích có thể là tín dụng vẫn sinh lời trong khi chi phí vốn giảm, nhưng bài chưa kiểm định điều này.</p>','<p>H5 is not supported: GDP has a positive effect, against expectation. H6 is not either: COVID years go with higher NIM. One reading is that lending stayed profitable while funding cost fell, which the study did not test.</p>')],
 draw(c,p){const R=[['H1','NPL','−','NPL',1],['H2','SIZE','+','SIZE',1],['H3','CAP','+','CAP',1],['H4','INF','±','INF',1],['H5','GDP','−','GDP',0],['H6','COVID','−','COV',0]];const a=seg(p,0,.45),b=seg(p,.5,.8);return R.map((r,i)=>{const q=FG[r[3]],t=ease(seg(a,i*.1,i*.1+.4)),st=ease(seg(i<4?a:b,i<4?i*.12+.1:(i-4)*.35,i<4?i*.12+.5:(i-4)*.35+.5));return`<div class="row" style="grid-template-columns:34px 54px 44px 1fr auto;opacity:${t};transform:translateX(${(1-t)*26}px)"><b>${r[0]}</b><b>${r[1]}</b><span class="chip ${r[2]==='+'?'ok':r[2]==='±'?'wr':'no'}">${L==='vi'?'kỳ vọng':'exp.'} ${r[2]}</span><span class="mono" style="color:var(--mut)">β = ${sg(q[0])} · p ${q[2].startsWith('<')?q[2]:'= '+q[2]}</span><span class="chip ${r[4]?'ok':'no'}" style="opacity:${st};transform:scale(${lerp(1.5,1,st)})">${r[4]?(L==='vi'?'ủng hộ':'supported'):(L==='vi'?'không ủng hộ':'not supported')}</span></div>`}).join('')+`<div style="margin-top:8px;font-size:12px;color:var(--mut)">${L==='vi'?'Dấu COVID đã hiệu chỉnh: bảng gốc ghi −0,128 do mã hoá biến giả trong Stata (xem Phụ lục A của báo cáo).':'COVID sign corrected: the source table shows −0.128 because of dummy coding in Stata (see Appendix A of the report).'}</div>`}});
add({id:'close',act:T('Kết luận','Conclusion'),h:T('Hàm ý, giới hạn và hướng tiếp theo','Implications, limits and next steps'),vh:300,kind:'html',
 steps:[T('<p>Năm hàm ý chính sách <em>do bài đề xuất</em>, bốn giới hạn cần nói rõ và ba hướng mở rộng.</p>','<p>Five policy implications <em>proposed by the study</em>, four limits to state plainly, and three extensions.</p>'),
 T('<p>COVID mới chỉ đo bằng một biến giả; mẫu 27 trên 33 ngân hàng, 6 năm. Kết quả vì vậy là bằng chứng mô tả cho mẫu này, chưa phải quan hệ nhân quả chắc chắn.</p>','<p>COVID is only a dummy; the sample covers 27 of 33 banks over 6 years. Results are descriptive evidence for this sample, not firm causality.</p>')],
 draw(c,p){const col=[[T('Hàm ý (đề xuất của bài)','Implications (the study’s proposals)'),'var(--teal)',[T('Mở rộng quy mô và dịch vụ mới','Scale up and add services'),T('Tối ưu vốn chủ sở hữu','Optimise equity capital'),T('Theo dõi tăng trưởng GDP để mở rộng tín dụng đúng lúc','Track GDP growth to time credit expansion'),T('Kiểm soát chặt nợ xấu','Tighten bad-loan control'),T('Phản ứng linh hoạt trước cú sốc','Respond flexibly to shocks')]],[T('Giới hạn','Limits'),'var(--amber)',[T('Dữ liệu công bố còn thiếu, phải gom từ nhiều nguồn','Disclosed data are incomplete and pooled from sources'),T('27 trên 33 ngân hàng, 6 năm','27 of 33 banks, 6 years'),T('Chính sách và sự kiện chưa đưa vào đầy đủ','Policies and events not fully included'),T('COVID mới đo bằng một biến giả','COVID measured only by a dummy')]],[T('Hướng tiếp theo','Next steps'),'var(--vio)',[T('Mở rộng dữ liệu, phân tích đa chiều','Broaden data and multi-angle analysis'),T('So sánh quốc tế','International comparison'),T('Mô hình học máy và AI','Machine-learning and AI models')]]];
  return `<div class="cards">${col.map((c0,i)=>{const t=ease(seg(p,i*.2,i*.2+.35));return`<div class="card" style="opacity:${t};transform:translateY(${(1-t)*24}px);border-top:3px solid ${c0[1]}"><h4 style="color:${c0[1]}">${tx(c0[0])}</h4><ul>${c0[2].map((x,j)=>`<li style="opacity:${ease(seg(p,i*.2+.15+j*.06,i*.2+.4+j*.06))}">${tx(x)}</li>`).join('')}</ul></div>`}).join('')}</div>`}});

const mi=s=>`<mi>${s}</mi>`,mo=s=>`<mo>${s}</mo>`,sb=(a,b)=>`<msub>${a}${b}</msub>`,mr=s=>`<mrow>${s}</mrow>`,sp=(a,b)=>`<msup>${a}${b}</msup>`,MATH=s=>`<math display="block">${s}</math>`;

const EQ={pool:MATH(sb(mi('NIM'),IT)+mo('=')+mi('α')+mo('+')+BT+BX+mo('+')+sb(mi('ε'),IT)),

add({id:'hero',act:T('Mở đầu','Overview'),h:T('Điều gì quyết định biên lãi của ngân hàng?','What drives a bank’s interest margin?'),hero:1,vh:440,cue:1,
 steps:[T('<p>Mỗi chấm là một ngân hàng trong một năm: 27 ngân hàng thương mại cổ phần niêm yết, 2018 đến 2023, tổng cộng <em>162 chấm</em>. Vòng trong là 2018, vòng ngoài là 2023; chấm càng nóng, biên lãi (NIM) càng cao.</p>','<p>Each dot is one bank in one year: 27 listed joint-stock banks, 2018 to 2023, <em>162 dots</em> in all. Inner ring is 2018, outer ring 2023; hotter means higher net interest margin (NIM).</p>'),
 T('<p>Trải các chấm ra theo thời gian rồi nối lại: mỗi đường là NIM của một ngân hàng qua sáu năm.</p>','<p>Spread the dots over time and connect them: each line is one bank’s NIM over six years.</p>'),
 T('<p>Đường cam là trung bình ngành: <em>3,07%</em> (2018), đỉnh <em>3,59%</em> (2022), <em>3,20%</em> (2023). PGBank (xanh lá) nằm dưới trung bình ở cả sáu năm; bài đi tìm lý do.</p>','<p>The amber line is the sector mean: <em>3.07%</em> (2018), peak <em>3.59%</em> (2022), <em>3.20%</em> (2023). PGBank (teal) sits below it in all six years; the study asks why.</p>')],
 draw(c,p){const{W,H}=c,g=geom(W,H,{l:40,r:small(W)?34:52,t:20,b:34});const X=i=>g.l+i/5*g.w,Y=v=>g.b-v/10*g.h;const cx=W/2,cy=H/2,R=Math.min(W,H)*.44;
  const m=ease(seg(p,.1,.32)),lt=ease(seg(p,.3,.52)),tm=ease(seg(p,.5,.68)),dim=ease(seg(p,.68,.86)),ap=ease(seg(p,0,.08));let s=`<g opacity="${m}">${gridY(g,[0,2,4,6,8,10],Y,v=>v+'%')}</g>`;
  s+=`<g opacity="${m}">${yrAxis(g,X)}</g>`;
  for(let b=0;b<NB;b++){if(b===PG)continue;if(lt>0)s+=`<path d="${path(partial(nim[b],lt,X,Y))}" fill="none" stroke="${C.blue}" stroke-width="1.4" opacity="${(lerp(.5,.12,dim)*Math.min(1,lt*3)).toFixed(2)}"/>`}
  if(lt>0)s+=`<path d="${path(partial(nim[PG],Math.max(lt,0),X,Y))}" fill="none" stroke="${C.teal}" stroke-width="${lerp(1.6,3.6,dim).toFixed(1)}" stroke-linecap="round" opacity="${Math.min(1,lt*3)}"/>`;
  D.P.forEach((r,k)=>{const b=r[0],y=r[1];const ang=b/NB*Math.PI*2-Math.PI/2,rad=R*(.28+.72*y/5);const x0=cx+Math.cos(ang)*rad,y0=cy+Math.sin(ang)*rad,x1=X(y),y1=Y(r[2]);const x=lerp(x0,x1,m),yy=lerp(y0,y1,m);const o=ease(seg(ap,k/162*.7,k/162*.7+.3));const col=b===PG?C.teal:mix(C.blue,C.coral,r[2]/9.5);s+=`<circle cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" r="${(lerp(b===PG?6:4.6,b===PG?4.2:2.6,m)*o).toFixed(2)}" fill="${col}" opacity="${lerp(1,lerp(.9,.5,lt),m).toFixed(2)}"/>`});
  if(tm>0){s+=`<path d="${path(partial(ym,tm,X,Y))}" fill="none" stroke="${C.amber}" stroke-width="3.6" stroke-linecap="round"/>`;ym.forEach((v,i)=>{if(i/5<=tm+.001&&[0,4,5].includes(i))s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${C.amber}"/>`+tt(X(i),Y(v)-11,f(v)+'%','lb','middle',`style="fill:${C.amber}"`)})}
  if(lt>.97)s+=tt(X(5)+6,Y(nim[0][5])+4,'VPB','lb','start',`style="fill:${C.blue}"`);if(dim>.6)s+=tt(X(5)+6,Y(nim[PG][5])+4,'PGB','lb','start',`style="fill:${C.teal}"`);return s}});

add({id:'tests',act:T('Mô hình','Model'),h:T('FEM thắng, nhưng phải sửa bằng FGLS','FEM wins, but FGLS is needed'),vh:440,kind:'html',full:0,
 steps:[T('<p>Hiệu ứng riêng của từng ngân hàng có thật: kiểm định F và Breusch–Pagan bác bỏ Pooled OLS (tính lại từ phụ lục dữ liệu: F(26; 129) = 23,2, p &lt; 0,001; R² Pooled 0,494).</p>','<p>Bank-specific effects are real: the F and Breusch–Pagan tests reject Pooled OLS (recomputed from the data appendix: F(26, 129) = 23.2, p &lt; 0.001; pooled R² 0.494).</p>'),
 T('<p>Hausman (p = 0,0036) chọn FEM thay REM. R² within của FEM là 0,179 (tính lại): hệ số dựa trên biến động trong từng ngân hàng, ít được “nâng” bởi khác biệt giữa các ngân hàng.</p>','<p>Hausman (p = 0.0036) prefers FEM over REM. FEM within-R² is 0.179 (recomputed): coefficients rest on within-bank variation, not on between-bank differences.</p>'),
 T('<p>Nhưng phần dư vi phạm ba giả định: phương sai sai số thay đổi, tự tương quan (p = 0,0009) và phụ thuộc chéo (p = 0,0092). VIF trung bình 1,32 thì sạch. Vì vậy bài báo cáo FGLS.</p>','<p>But residuals break three assumptions: heteroskedasticity, autocorrelation (p = 0.0009) and cross-sectional dependence (p = 0.0092). Mean VIF 1.32 is clean. So the study reports FGLS.</p>')],
